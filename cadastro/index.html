<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="../imagens/logo-favicon.svg">
    <title>Cadastro | Painel de Controle</title>
</head>
<body>
    <main>
        <header>
            <h1 id="instrucao1">Cadastre-se</h1>
            <p id="instrucao2">Cadastre as informações de autenticação para gerenciar o cardápio do restaurante.</p>
        </header>

        <section id="formulario">
            <form action="cadastrar.php" method="post">
                <div>
                    <label for="nome-completo">Nome completo</label>
                    <input type="text" name="nome-completo" id="nome-completo" class="campo" placeholder="Digite seu nome" autocomplete="name" required>
                </div>
                <br>
                <div>
                    <label for="username">Nome de usuário</label>
                    <input type="text" name="username" id="username" class="campo" placeholder="Digite seu username" autocomplete="username" required>
                </div>
                <br>
                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" class="campo" placeholder="Digite seu email" autocomplete="email" required>
                </div>
                <br>
                <div>
                    <label for="senha">Senha</label>
                    <input type="password" name="senha" id="senha" class="campo" placeholder="Digite sua senha" required>
                </div>
                <br>
                <a href="../painel-de-controle_v1/index.html"><button type="submit" id="botao">Cadastrar</button></a>
            </form>
        </section>
        <p id="instrucao3">Já possui cadastro? Faça <a href="../login/index.html">login</a></p>
    </main>
</body>
</html>
